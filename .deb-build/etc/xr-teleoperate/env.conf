# /etc/xr-teleoperate/env.conf
# XR-Teleoperate runtime configuration(EnvironmentFile=).
# 被 systemd unit xr-teleop / xr-teleimager / xr-heartbeat 加载。
# 修改后: sudo xr-teleop-control restart

# 机器人 ID(后端 autobot/autobot_id 对应,默认 g1_001)
XR_TELEOP_ROBOT_ID=g1_001

# 后端地址(xr_teleoperate-main 将 wlan0 IP 上报到这里)
# 默认上报线上后端;临时调试内网后端时改回,例: http://192.168.2.117:19269
# 心跳上报的 wanIp:port 是前端遥操"直连模式"的数据源,这行不可留空/注释。
XR_TELEOP_BACKEND_URL=https://hhqskj.com

# 对外网 IP(wlan0,VR 服务地址)。**建议留空** —— 留空时由 heartbeat_register.py
# 自动检测(与页面 /host-info 用同一份实现)。只有自动检测不准时才需要写死。
# XR_TELEOP_WAN_IP=192.168.2.203

# ROS / DDS 网卡 IP(eth0,仅诊断用)。留空同样自动检测。
# XR_TELEOP_ETH0_IP=192.168.123.164

# 后端机器人鉴权 token(后端开启鉴权时必填,否则留空)
# XR_TELEOP_ROBOT_TOKEN=

# VR 对外端口(默认 8012)
XR_TELEOP_PUBLIC_PORT=8012

# 心跳周期(秒,默认 30)
XR_TELEOP_HEARTBEAT_INTERVAL=30

# 镜像服务端选 backend(opencv | scam | auto,默认 auto)
# CAM_BACKEND=opencv

# GLIBC235 兼容层路径(只有 scam backend 选且需要时填)
# GLIBC_235=/home/unitree/glibc235/lib/aarch64-linux-gnu
#