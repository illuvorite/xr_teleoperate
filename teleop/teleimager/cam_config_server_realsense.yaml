head_camera:
  enable_zmq: true
  zmq_port: 55555
  enable_webrtc: true
  webrtc_port: 60001
  webrtc_codec: h264
  type: realsense
  image_shape: [720, 1280]
  binocular: false
  fps: 30
  video_id: null
  # serial_number：留 null 表示自动选择（机器上只有一台 RealSense 时推荐）。
  #   ⚠ 若确实要锁定某台相机，这里必须填 pyrealsense2 枚举出的 ASIC 序列号，例如：
  #       python -c "import pyrealsense2 as rs;print([d.get_info(rs.camera_info.serial_number) for d in rs.context().query_devices()])"
  #     注意它和 /sys/bus/usb/devices/*/serial 里的 USB 描述符序列号**不是同一个值**
  #     （同一台 D435i：SDK 报 243622071728，sysfs 报 252943060513），填错会导致
  #     "[Image Server] Cannot find RealSenseCamera for head_camera" 并反复重启。
  serial_number: null
  physical_path: null

left_wrist_camera:
  enable_zmq: false
  zmq_port: 55556
  enable_webrtc: false
  webrtc_port: 60002
  webrtc_codec: h264
  type: opencv
  image_shape: [480, 640]
  binocular: false
  fps: 30
  video_id: 999
  serial_number: null
  physical_path: null

right_wrist_camera:
  enable_zmq: false
  zmq_port: 55557
  enable_webrtc: false
  webrtc_port: 60003
  webrtc_codec: h264
  type: opencv
  image_shape: [480, 640]
  binocular: false
  fps: 30
  video_id: 999
  serial_number: null
  physical_path: null